<style>
/* ==========================================================================
   1. FONTS, VARIABLER & GLOBAL STYLING
   ========================================================================== */
@font-face { font-family: 'Skogstavskrift'; src: url('skogstavskrift.otf') format('opentype'); font-weight: normal; font-style: normal; }
@font-face { font-family: 'Trykkskrift'; src: url('trykkskrift.otf') format('opentype'); font-weight: normal; font-style: normal; }
@import url('https://fonts.googleapis.com/css2?family=Andika&display=swap');

:root { 
    --vokal-farge: #ffcccc; --vokal-tekst: #e74c3c; --konsonant-tekst: #2c3e50; --konsonant-overskrift: #2980b9; --alt-match: #27ae60; 
    --sidebar-bg: #243447; --item-bg: #2c3e50; --accent-green: #27ae60; --sidebar-text: #ffffff; --main-bg: #f0f2f5; 
    --btn-generate: var(--accent-green); --btn-reset: #ff7675; --btn-print: #2980b9; --btn-download: #9b59b6; --grid-border: #333; 
}
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background-color: var(--main-bg); color: #333; overflow: hidden; }

/* ==========================================================================
   2. SIDEBAR, MENY-ELEMENTER & KNAPPER
   ========================================================================== */
.sidebar { width: 350px; min-width: 350px; background-color: var(--sidebar-bg); color: var(--sidebar-text); padding: 15px 15px 2px 15px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.3); z-index: 10; overflow-y: auto; max-height: 100vh; }
.sidebar h2 { margin: 0 0 15px 0; font-size: 1.1rem; text-align: center; text-transform: uppercase; }

.control-item { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 0.9rem; }
select, input[type="number"] { background: #ecf0f1; border: none; border-radius: 4px; padding: 5px; font-size: 0.8rem; width: 160px; }
textarea { width: 100%; height: 95px; padding: 10px; border-radius: 6px; border: none; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; margin-bottom: 15px; background-color: #ecf0f1; resize: none; }

.switch { position: relative; display: inline-block; width: 40px; height: 20px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--accent-green); }
input:checked + .slider:before { transform: translateX(20px); }

.action-btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; margin-bottom: 0; color: white; transition: 0.2s; box-sizing: border-box; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; }
.action-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
.btn-row { display: flex; gap: 10px; margin-top: 2px; }
.btn-generate { background-color: var(--btn-generate); }
.btn-reset { background-color: var(--btn-reset); }
.btn-print { background-color: var(--btn-print); }
.btn-download { background-color: var(--btn-download); }

/* ==========================================================================
   3. HAMBURGERMENY & DROPDOWN
   ========================================================================== */
.menu-container { position: relative; margin-bottom: 10px; }
.hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; width: 20px; padding: 5px; }
.hamburger span { display: block; width: 100%; height: 2px; background-color: white; border-radius: 1px; transition: 0.3s; }
.menu-item-disabled { opacity: 0.4; filter: grayscale(100%); pointer-events: none; cursor: default; }
.dropdown-menu { display: none; position: absolute; top: 25px; left: 0; background-color: #2c3e50; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; width: 200px; z-index: 100; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); }
.dropdown-menu.show { display: block; }
.dropdown-menu a { display: block; color: white; padding: 12px 15px; text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
.dropdown-menu a:hover { background-color: #34495e; }
.menu-icon { width: 20px; height: 20px; margin-right: 10px; vertical-align: middle; object-fit: contain; border-radius: 3px; }

/* ==========================================================================
   4. EGEN OVERSKRIFT (SPESIFIKK RAD-STYLING)
   ========================================================================== */
.menu-item.overskrift-rad { display: flex !important; align-items: center !important; justify-content: space-between !important; background: rgba(0,0,0,0.2) !important; padding: 10px 12px !important; border-radius: 8px !important; margin-bottom: 6px !important; box-sizing: border-box !important; }
.menu-item.overskrift-rad label { color: var(--sidebar-text) !important; font-size: 0.9rem !important; font-weight: normal !important; white-space: nowrap !important; margin: 0 !important; }
.menu-item.overskrift-rad input[type="text"] { width: 160px !important; height: 28px !important; padding: 3px 8px !important; font-size: 0.8rem !important; font-family: inherit !important; box-sizing: border-box !important; border-radius: 4px !important; background-color: #ffffff !important; color: #2c3e50 !important; border: none !important; }
.menu-item.overskrift-rad input[type="text"]::placeholder { color: #94a3b8 !important; opacity: 1 !important; }

/* ==========================================================================
   5. MANUELLE ORDGRUPPEBOKSER
   ========================================================================== */
.ord-gruppe-boks { border: 2px dashed #cbd5e0; border-radius: 6px; padding: 12px; margin-bottom: 15px; background-color: #ffffff; transition: background-color 0.3s ease, border-color 0.3s ease; }
.ord-gruppe-boks h4 { margin: 0 0 8px 0; font-size: 0.9rem; color: #4a5568; text-transform: uppercase; letter-spacing: 0.5px; }
.ord-gruppe-boks ul { list-style: none; padding: 0; margin: 0; }
.ord-gruppe-boks.mangler-ord { background-color: #fff5f5 !important; border-color: #feb2b2 !important; }
.ord-gruppe-boks.full-ord { background-color: #f0fff4 !important; border-color: #9ae6b4 !important; }

/* ==========================================================================
   6. HOVEDOMRÅDE & SKALERING AV FORHÅNDSVISNING
   ========================================================================== */
.main-content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; height: 100vh; box-sizing: border-box; }
.ark-skalering { display: flex; align-items: center; justify-content: center; transform: scale(0.75); transform-origin: center center; }
@media (max-height: 850px) { .ark-skalering { transform: scale(0.65); } }
@media (max-height: 720px) { .ark-skalering { transform: scale(0.52); } }

/* ==========================================================================
   7. A4 ARKET & INNHOLD PÅ ARKET (PRINT & FORHÅNDSVISNING)
   ========================================================================== */
#capture-area { background: white; padding: 25mm 20mm; width: 210mm; height: 297mm; min-width: 210mm; min-height: 297mm; box-shadow: 0 10px 30px rgba(0,0,0,0.15); box-sizing: border-box; }
#main-title { font-size: 2.2rem; color: #333; text-align: center; margin-top: 0; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }
.instruksjon { font-size: 1.6rem; font-weight: bold; margin-top: 35px; margin-bottom: 15px; text-decoration: underline; }

.ord-tabell { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
.ord-tabell td { border: 2px solid var(--grid-border); text-align: center; padding: 15px; font-size: 2.2rem; width: 33.33%; }

.lese-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-bottom: 20px; }
.lese-grid div { border: 2px solid var(--grid-border); text-align: center; padding: 12px; font-size: 2.1rem; background: #fff; }
.lese-grid.smal div { padding: 6px; font-size: 1.8rem; }

.skrive-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px 40px; width: 100%; margin-bottom: 25px; }
.lines-container { width: 100%; max-width: 220px; margin: -20px auto 2px auto; display: inline-block; }
.l { border-bottom: 1px solid #ccc; height: 26px; width: 100%; }
.l.thick { border-bottom: 3px solid #333; }

.setning-linje { display: flex; align-items: flex-end; justify-content: space-between; font-size: 1.6rem; margin-bottom: 18px; line-height: 1.3; }
.setning-tekst { flex-grow: 1; display: flex; align-items: flex-end; flex-wrap: wrap; white-space: pre-wrap; }
.setning-tekst span.linje-blank + font { white-space: pre-wrap; }
.linje-blank { display: inline-block; width: 180px; border-bottom: 2px solid #000; margin: 0 10px; height: 10px; vertical-align: middle; margin-bottom: 4px; white-space: nowrap; }
.fasit-ord { width: 120px; text-align: right; font-weight: normal; }

/* ==========================================================================
   8. MODAL-STYLING (MANUELT ORDVALG)
   ========================================================================== */
.modal-skall { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
.modal-innhold { background-color: #fff; padding: 20px; border-radius: 8px; width: 85%; max-width: 900px; height: 80vh; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
.modal-hode { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
.modal-lukk { font-size: 28px; font-weight: bold; cursor: pointer; color: #718096; }
.modal-lukk:hover { color: #000; }
.modal-body { display: flex; flex: 1; overflow: hidden; margin-top: 15px; gap: 20px; }

.modal-venstre { width: 30%; border-right: 2px solid #edf2f7; padding-right: 15px; display: flex; flex-direction: column; }
.modal-venstre ul { list-style: none; padding: 0; margin-top: 10px; overflow-y: auto; flex: 1; }
.modal-venstre li { background: #edf2f7; padding: 10px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
.modal-fjern-btn { background: #e53e3e; color: white; border: none; border-radius: 3px; padding: 2px 8px; cursor: pointer; }

.modal-hoyre { width: 70%; display: flex; flex-direction: column; }
#søkOrdInput { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 4px; margin-bottom: 15px; font-size: 1rem; }
.ord-velger-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; overflow-y: auto; flex: 1; padding-bottom: 10px; }
.ord-knapp { background: #f7fafc; border: 1px solid #cbd5e0; border-radius: 4px; padding: 12px; text-align: center; cursor: pointer; font-size: 1.1rem; font-weight: 500; transition: all 0.2s; }
.ord-knapp:hover { background: #e2e8f0; border-color: #4a5568; }
.ord-knapp.valgt { background: #48bb78; color: white; border-color: #38a169; }
.ord-knapp.deaktivert { opacity: 0.5; cursor: not-allowed; }

.modal-bunn { border-top: 1px solid #e2e8f0; padding-top: 15px; display: flex; justify-content: flex-end; gap: 10px; }
.btn-danger { background-color: #e53e3e; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
.btn-danger:hover { background-color: #c53030; }

/* ==========================================================================
   9. STRICT PRINT-STYLING (RENE A4 REGLER FOR UTSKRIFT)
   ========================================================================== */
@media print {
    @page { size: A4 portrait; margin: 0; }
    html, body { width: 210mm; height: 297mm; background: white !important; overflow: visible !important; }
    .sidebar { display: none !important; }
    .main-content { padding: 0 !important; height: auto !important; width: 210mm !important; display: block !important; overflow: visible !important; }
    .ark-skalering { transform: none !important; display: block !important; width: 210mm !important; height: 297mm !important; }
    #capture-area { box-shadow: none !important; padding: 25mm 20mm !important; width: 210mm !important; height: 297mm !important; margin: 0 !important; float: none !important; }
    .ord-tabell td, .linje-blank, .l.thick { border-color: #000 !important; }
    .l { border-color: #ccc !important; }
}
</style>   
</head>
